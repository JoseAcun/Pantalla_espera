name: twitch-stream-overlay

services:
  overlay:
    build: .
    env_file:
      - .env
    environment:
      TWITCH_TOKEN_FILE: /data/twitch_tokens.json
    ports:
      - "${OVERLAY_PORT:-8010}:8000"
    volumes:
      - twitch-overlay-data:/data
    networks:
      - stream-data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  twitch-overlay-data:

networks:
  stream-data:
    external: true
