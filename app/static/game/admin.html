<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/game/admin.css"><title>Game Master</title></head><body><main><header><div><p>STREAM_OS // GAME MASTER</p><h1>Raid control</h1></div><input id="token" type="password" placeholder="OVERLAY_ADMIN_TOKEN"></header><p id="status">Configura el token de administración.</p><section><h2>Categorías detectadas</h2><div id="categories"></div></section><section><h2>Crear objeto temático</h2><form id="item-form"><select name="category_id" id="item-category"><option value="">Global / STREAM_OS</option></select><input name="name" placeholder="Ej. Kernel Plate" required><select name="rarity"><option>common</option><option>uncommon</option><option>rare</option><option>epic</option><option>legendary</option><option>corrupted</option></select><select name="slot"><option>weapon</option><option>armor</option><option>accessory</option><option>consumable</option></select><input name="effect_type" value="none"><input name="effect_value" type="number" value="0"><input name="weight" type="number" value="100" min="1"><button>Crear objeto</button></form><div id="items"></div></section><section><h2>Iniciar Boss de prueba</h2><form id="boss-form"><input name="name" value="Unauthorized_Process.exe" required><input name="max_hp" type="number" value="1000" min="100"><input name="base_party_damage" type="number" value="12" min="0"><input name="round_seconds" type="number" value="15" min="5" max="120"><button>Iniciar raid</button></form><p>Usa la categoría actual. Chat: <code>!join</code>, <code>!attack</code>, <code>!defend</code>, <code>!heal</code>.</p></section></main><script src="/static/game/admin.js"></script></body></html>
